                <circle class="node node-blue" cx="297" cy="136" r="4"/>
                <circle class="node node-cyan" cx="527" cy="219" r="4"/>
                <circle class="node node-cyan" cx="556" cy="428" r="4"/>
                <circle class="node node-blue" cx="399" cy="564" r="4"/>
