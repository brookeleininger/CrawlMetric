                    r="136"
                />

                <circle class="node node-mint" cx="266" cy="243" r="4"/>
                <circle class="node node-mint" cx="445" cy="253" r="4"/>
                <circle class="node node-green" cx="484" cy="372" r="4"/>
                <circle class="node node-mint" cx="402" cy="476" r="4"/>
                <circle class="node node-mint" cx="215" cy="365" r="4"/>

            </g>


            <!-- =====================================
                 TRACK 6
