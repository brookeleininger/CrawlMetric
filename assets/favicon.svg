            </g>


            <!-- =====================================
                 CENTER C
                 DOES NOT MOVE
            ====================================== -->

            <g class="center-c">

                <rect x="322" y="315" width="10" height="70"/>

                <rect x="322" y="315" width="55" height="10"/>

                <rect x="322" y="375" width="55" height="10"/>

                <rect x="377" y="321" width="9" height="9"/>

                <rect x="377" y="370" width="9" height="9"/>

