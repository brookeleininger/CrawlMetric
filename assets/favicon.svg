<svg
            class="crawl-logo"
            viewBox="0 0 700 700"
            xmlns="http://www.w3.org/2000/svg"
            aria-label="CrawlMetric"
        ><rect width="700" height="700" rx="120" fill="#0d1528"/><style>.track,
.outer-path {
    fill: none;

    stroke-width: 4;

    stroke-linecap: round;

    filter: url(#ringGlow);
}


/* =========================================
   OUTER BROKEN ARCS
========================================= */

.outer-path {
    stroke: url(#outerBlue);
}

.outer-path-a {
    stroke-dasharray: 455 1336;
    stroke-dashoffset: 0;
}

.outer-path-b {
    stroke-dasharray: 315 1476;
    stroke-dashoffset: -610;
}

.outer-path-c {
    stroke-dasharray: 210 1581;
    stroke-dashoffset: -1120;
}


/* =========================================
   TRACK 1
========================================= */

.track-1 {
    stroke: url(#deepBlue);

    stroke-dasharray:
        165 17
        82 12
        118 19
        48 13
        145 22
        67 14
        98 18;
}


/* =========================================
   TRACK 2
========================================= */

.track-2 {
    stroke: url(#deepBlue);

    stroke-dasharray:
        96 14
        143 20
        51 12
        78 16
        122 18
        62 13
        88 17;
}


/* =========================================
   TRACK 3
========================================= */

.track-3 {
    stroke: url(#blueCyan);

    stroke-dasharray:
        121 17
        55 12
        91 16
        42 11
        135 20
        68 14
        74 15;
}


/* =========================================
   TRACK 4
========================================= */

.track-4 {
    stroke: url(#blueCyan);

    stroke-dasharray:
        76 13
        112 17
        43 11
        69 14
        101 18
        52 12
        80 16;
}


/* =========================================
   TRACK 5
========================================= */

.track-5 {
    stroke: url(#cyanMint);

    stroke-dasharray:
        94 15
        44 11
        76 14
        37 10
        91 17
        49 12
        65 14;
}


/* =========================================
   TRACK 6
========================================= */

.track-6 {
    stroke: url(#mintGreen);

    stroke-dasharray:
        61 12
        82 15
        35 10
        58 13
        76 16
        41 11;
}


/* =========================================
   TRACK 7
========================================= */

.track-7 {
    stroke: url(#mintGreen);

    stroke-dasharray:
        54 11
        28 9
        67 14
        35 10
        51 12
        24 9;
}


/* =========================================
   NODES
========================================= */

.node {
    filter:
        drop-shadow(0 0 2px currentColor);
}

.node-blue {
    fill: #175b98;
    color: #175b98;
}

.node-cyan {
    fill: #168c98;
    color: #168c98;
}

.node-mint {
    fill: #2e9d79;
    color: #2e9d79;
}

.node-green {
    fill: #71ad4a;
    color: #71ad4a;
}


/* =========================================
   CENTER C
========================================= */

.orbit{opacity:1}.track,.outer-path{stroke-width:10;filter:none}.center-c{transform:translate(350px,350px) scale(1.65) translate(-350px,-350px)}.center-c rect{fill:#f2f2e9;opacity:1}</style>

            <!-- =====================================
                 GRADIENTS
            ====================================== -->

            <defs>

                <linearGradient id="outerBlue" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#173f86"/>
                    <stop offset="45%" stop-color="#155b9b"/>
                    <stop offset="78%" stop-color="#177c9e"/>
                    <stop offset="100%" stop-color="#67a84d"/>
                </linearGradient>

                <linearGradient id="deepBlue" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#17488c"/>
                    <stop offset="55%" stop-color="#17649e"/>
                    <stop offset="100%" stop-color="#147f9d"/>
                </linearGradient>

                <linearGradient id="blueCyan" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#175a97"/>
                    <stop offset="52%" stop-color="#147f9e"/>
                    <stop offset="100%" stop-color="#179b96"/>
                </linearGradient>

                <linearGradient id="cyanMint" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#157f98"/>
                    <stop offset="52%" stop-color="#199a8d"/>
                    <stop offset="100%" stop-color="#3ba66f"/>
                </linearGradient>

                <linearGradient id="mintGreen" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#238f7f"/>
                    <stop offset="55%" stop-color="#48a763"/>
                    <stop offset="100%" stop-color="#78ad46"/>
                </linearGradient>

                <filter id="ringGlow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="1.4" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

            </defs>


            <!-- =====================================
                 OUTER CIRCUIT SYSTEM
            ====================================== -->

            <g class="orbit outer-orbit">

                <circle
                    class="outer-path outer-path-a"
                    cx="350"
                    cy="350"
                    r="285"
                />

                <circle
                    class="outer-path outer-path-b"
                    cx="350"
                    cy="350"
                    r="285"
                />

                <circle
                    class="outer-path outer-path-c"
                    cx="350"
                    cy="350"
                    r="285"
                />

                <!-- irregular outer nodes -->
                <circle class="node node-blue" cx="131" cy="168" r="4"/>
                <circle class="node node-blue" cx="523" cy="124" r="4"/>
                <circle class="node node-cyan" cx="621" cy="438" r="4"/>
                <circle class="node node-green" cx="162" cy="574" r="4"/>

            </g>


            <!-- =====================================
                 TRACK 1
                 r = 248
            ====================================== -->

            <g class="orbit orbit-1">

                <circle
                    class="track track-1"
                    cx="350"
                    cy="350"
                    r="248"
                />

                <circle class="node node-blue" cx="195" cy="156" r="4"/>
                <circle class="node node-blue" cx="559" cy="217" r="4"/>
                <circle class="node node-cyan" cx="568" cy="468" r="4"/>
                <circle class="node node-blue" cx="261" cy="582" r="4"/>
                <circle class="node node-blue" cx="103" cy="371" r="4"/>


            </g>


            <!-- =====================================
