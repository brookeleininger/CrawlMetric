            ====================================== -->

            <g class="orbit orbit-6">

                <circle
                    class="track track-6"
                    cx="350"
                    cy="350"
                    r="108"
                />

                <circle class="node node-green" cx="328" cy="244" r="4"/>
                <circle class="node node-green" cx="438" cy="287" r="4"/>
                <circle class="node node-green" cx="439" cy="411" r="4"/>
                <circle class="node node-green" cx="321" cy="454" r="4"/>
